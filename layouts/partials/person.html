<article class="person">
  <div class="person__photo">
    {{- with .photo }}
    {{- partial "img.html" (dict "src" . "alt" $.name "w" 172 "h" 172 "sizes" "96px") }}
    {{- else }}
    <span aria-hidden="true">{{ substr (.role | default .name) 0 1 }}</span>
    {{- end }}
  </div>
  <div>
    <h3 class="person__name">{{ .name }}</h3>
    {{- with .role }}<p class="person__role">{{ . }}</p>{{ end }}
    {{- with .bio }}<p>{{ . }}</p>{{ end }}
    {{- with .email }}<p><a href="mailto:{{ . }}">{{ . }}</a></p>{{ end }}
  </div>
</article>
