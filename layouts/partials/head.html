{{- $data := site.Data.site -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ $data.settings.title }}{{ else }}{{ .Title }} | {{ $data.settings.title }}{{ end }}</title>
<meta name="description" content="{{ .Params.summary | default .Params.excerpt | default site.Params.description }}">
{{- if site.Params.noindex }}
<meta name="robots" content="noindex, nofollow">
{{- end }}
<link rel="canonical" href="{{ .Permalink }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
{{- $css := resources.Get "css/main.css" -}}
{{- if hugo.IsProduction }}{{ $css = $css | minify | fingerprint }}{{ end }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}"{{ with $css.Data.Integrity }} integrity="{{ . }}"{{ end }}>
