{{ define "main" }}
{{- $data := site.Data.site -}}
{{- partial "page-hero.html" . }}
<div class="section">
  <div class="container narrow prose">
    {{ .Content }}
  </div>
</div>

<section class="section section--tint" aria-labelledby="leadership">
  <div class="container">
    <h2 id="leadership">Our vicar and leadership</h2>
    <div class="people-grid">
      {{- range where $data.staff "featured" true }}
      {{- partial "person.html" . }}
      {{- end }}
    </div>
    <p><a class="button" href="{{ "/about/staff/" | relURL }}">Meet the whole team</a></p>
  </div>
</section>

{{- partial "location.html" $data.settings }}
{{ end }}
