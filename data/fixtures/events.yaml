    days: 9
    time: "14:00"
    minutes: 90
    location: Church hall
  - title: Choral Evensong
    days: 15
    time: "18:00"
    minutes: 60
    location: St John's
  - title: Organ recital
    days: 22
    time: "12:30"
    minutes: 45
    location: St John's
