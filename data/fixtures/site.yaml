  - path: our-churches/st-johns
    title: St John the Baptist, Halesowen
    layout: church
    weight: 21
    summary: Our Norman parish church in the centre of Halesowen.
    heroImage: images/st-john-profile.jpeg
    gallery:
      - src: images/st-john-font.jpeg
        alt: The Norman font
        caption: The twelfth-century Norman font
      - src: images/st-john-altar.jpg
        alt: The high altar
        caption: The sanctuary and high altar
      - src: images/st-john-choir.jpeg
        alt: The choir stalls
        caption: The choir
      - src: images/st-john-nave.jpg
        alt: The nave
        caption: The Norman nave
    body: |
      The church is in the centre of Halesowen, a short walk from the bus station and the
      Cornbow shopping centre. It is open for services and when the
      [Traidpoint café](/traidpoint/) is open (Wednesday, Friday and Saturday, 10:30am to
      12:30pm), and at other times by arrangement.

      ## Accessibility

      There are ramps with handrails at the entrance and into the café area, accessible
      toilets with baby change, and sensory bags at the welcome desk. Please ask a sidesperson
      if you need any help. See our [accessibility page](/accessibility/) for full details.

