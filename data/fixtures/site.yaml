  - slug: norman-font-heritage
    title: "Heritage corner: the Norman font"
    publishedAt: "2026-08-14T10:00:00+01:00"
    author: Heritage Team
    excerpt: Our font is one of the oldest things in the church. Here is a closer look.
    tags: [Heritage]
    media:
      - type: image
        src: images/st-john-font.jpeg
        alt: The Norman font
        caption: The Norman font
      - type: image
        src: images/st-john-nave.jpg
        alt: The Norman nave
        caption: The nave, from the same period
    body: |
      Generations of Halesowen families have been baptised at our Norman font. Like the
      nave arches, it dates from the early twelfth century and is among the oldest parts of
      the building.

  - slug: bell-ringers-wanted
    title: Bell ringers wanted
    publishedAt: "2026-07-30T10:00:00+01:00"
    author: Tower Captain
    excerpt: Learn to ring on our ring of eight. No experience needed.
    tags: [Bells, Community]
    media:
      - type: image
        src: images/st-john-tower.jpg
        alt: The church tower
        caption: Our tower, finished in 1440
    body: |
      Our tower has rung over Halesowen for centuries, and we would love more people to
      learn. Practice night is Tuesday at 7:30pm. Just come to the tower door.

