pages:
  - path: about
    title: About Us
    layout: about
    weight: 10
    summary: Over nine centuries of worship at the heart of Halesowen.
    heroImage: images/st-john-tower.jpg
    body: |
      St John the Baptist is a Grade I listed parish church in the Black Country town of
      Halesowen. It is part of the Church of England, in the Diocese of Worcester, and for
      over 900 years it has been at the centre of the town's religious and civic life. Its
      160-foot spire rises out of the Stour valley and can be seen for miles around.

      ## Our history

      The church appears in the Domesday Book of 1086, which records that the manor of
      *Halas* had "a church with two priests". This was probably a Saxon building. The
      manor was held by Roger de Montgomery, Earl of Shrewsbury, who founded the oldest
      parts of the church that stands today.

      The Norman nave, arches and font date from the early twelfth century and are the
      oldest parts of the building. In the early thirteenth century the church was given to
      the newly founded Halesowen Abbey, and the Abbey appointed its clergy until the
      Dissolution in 1538. In the Middle Ages St John's was the mother church of a parish
      that covered much of what is now the Black Country.

      The town grew with industry in the eighteenth and nineteenth centuries, and so did
      the church. Richard Brindley Hone, vicar from 1836 to 1881, led a major restoration,
      and the large outer south aisle was built in the 1880s.

      ## The building

      The church is cruciform, with a nave, chancel, aisles and a west tower. The tower was
      begun around 1390 and finished in 1440. It has 114 steps to the parapet, and the
      spire rises a further 72 feet above it. The tower holds a ring of eight bells. Two of
      the 1707 bells are inscribed *Jesus be our speed* and *God bless the town of
      Halesowen*.

      Inside are memorials spanning many centuries, among them one to the poet and
      landscape gardener William Shenstone (1714–1763), creator of The Leasowes, who is
      buried in the churchyard.

      *History adapted from the Wikipedia article
      [St John the Baptist Church, Halesowen](https://en.wikipedia.org/wiki/St_John_the_Baptist_Church,_Halesowen),
      available under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/).*
      {.attribution}

      ## Our mission

      *Draft for the PCC to review.* We are a church family rooted in Halesowen for nine
      centuries, seeking to know Jesus and make him known. We want to be a place of
      worship, welcome and practical care, where people of every age and ability can
      belong, grow in faith and serve our community.

      ## Support for families

      We want every family to feel at home here, including families of children and young
      people with special educational needs and disabilities.
      [Guiding Lights](/guiding-lights/) is our support group for SEN parents and carers.
      Our [safeguarding](/safeguarding/) page explains how we keep everyone safe.

